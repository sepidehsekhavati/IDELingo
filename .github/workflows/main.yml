name: Build IDELingo APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install --upgrade flet

      - name: Build APK
        run: |
          # --yes answers "install Flutter/JDK/Android SDK?" prompts automatically,
          # since GitHub Actions has no interactive terminal (stdin).
          # Permissions are controlled entirely by pyproject.toml — no manual
          # AndroidManifest.xml and no manually-installed Flutter needed.
          flet build apk --yes -v

      - name: List build files
        run: |
          ls -la build/apk/ || echo "Build directory not found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDELingo-APK
          path: build/apk/*.apk
