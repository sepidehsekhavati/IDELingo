name: Build IDELingo APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install --upgrade "flet==0.28.3"

      - name: Build APK
        run: |
          # No Flutter is pre-installed, so flet build will download and
          # install the exact version it needs automatically (no prompt,
          # since there's no conflicting version already in PATH).
          # Permissions are controlled entirely by pyproject.toml.
          flet build apk -v

      - name: List build files
        run: |
          ls -la build/apk/ || echo "Build directory not found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDELingo-APK
          path: build/apk/*.apk
