name: Build IDELingo APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          
      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet==0.21.2
          
      - name: Check AndroidManifest
        run: |
          if [ -f "android/AndroidManifest.xml" ]; then
            echo "✅ Custom AndroidManifest.xml found"
            cat android/AndroidManifest.xml
          else
            echo "⚠️ No custom AndroidManifest.xml found"
          fi
          
      - name: Build APK
        run: |
          # Flet به صورت خودکار android/AndroidManifest.xml رو پیدا میکنه
          flet build apk
          
      - name: List build files
        run: |
          ls -la build/apk/ || echo "Build directory not found"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDELingo-APK
          path: build/apk/*.apk
