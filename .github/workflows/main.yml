name: Build IDELingo APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install --upgrade flet

      - name: Build APK
        run: |
          # Permissions are now controlled entirely by pyproject.toml
          # ([tool.flet.android.permission]) — no manual AndroidManifest.xml needed
          flet build apk

      - name: List build files
        run: |
          ls -la build/apk/ || echo "Build directory not found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDELingo-APK
          path: build/apk/*.apk
